[package]
name = "jarvis_ai"
version = "0.1.0"
description = "JARVIS AI desktop assistant"
authors = ["you"]
license = "MIT"
repository = "https://example.com/jarvis-ai"
edition = "2021"

[package.metadata]
tauri = true

[lib]
name = "jarvis_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "process", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
base64 = "0.22"
jarvis-core = { path = "../jarvis-core" }
